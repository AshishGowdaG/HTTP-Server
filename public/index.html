<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My C++ HTTP Server</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #1e293b;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 3rem;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
        }

        code {
            background: #334155;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .badge {
            display: inline-block;
            margin-top: 1rem;
            background: #22c55e;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 It Works!</h1>

        <p>
            This page is being served by your own
            <strong>C++ HTTP Server</strong>.
        </p>

        <p>
            You successfully handled:
        </p>

        <p>
            <code>Socket → Request → Response → Browser</code>
        </p>

        <div class="badge">
            Server Running
        </div>
    </div>
</body>
</html>
